[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oppaypay"
version = "0.2.0"
description = "Unofficial PayPay mobile API client library for Python"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "oppaypay contributors" }]
keywords = ["paypay", "api", "client"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "curl_cffi>=0.7.0",
    "pkce>=1.0",
]

[project.urls]
Repository = "https://github.com/xpof/oppaypay"

[tool.hatch.build.targets.wheel]
packages = ["oppaypay"]
