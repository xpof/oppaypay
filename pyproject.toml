[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oppaypay"
version = "0.4.3"
description = "Unofficial PayPay mobile API client library with advanced anti-bot measures."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "xpof"},
]
keywords = ["paypay", "api", "automation", "fintech"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "curl_cffi>=0.6.0",
    "pkce>=1.0.3",
    "cryptography>=41.0.0",
]

[project.urls]
Homepage = "https://github.com/xpof/oppaypay"
Repository = "https://github.com/xpof/oppaypay.git"
Issues = "https://github.com/xpof/oppaypay/issues"

[tool.setuptools.packages.find]
include = ["oppaypay*"]
exclude = ["tests*", "docs*"]
